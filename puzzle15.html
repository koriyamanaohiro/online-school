<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eee8dc">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>こもれびの15パズル</title>
<style>
:root{color-scheme:light;--ink:#44372d;--muted:#85776a;--green:#476553;--gap:7px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:#eee8dc;overscroll-behavior:none}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;background:radial-gradient(ellipse at 15% 10%,#fffaf0,transparent 65%),#eee8dc}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none}button:focus-visible{outline:3px solid #476553;outline-offset:4px}.app{width:min(100%,480px);margin:auto;padding: max(22px,env(safe-area-inset-top)) 22px max(42px,calc(env(safe-area-inset-bottom) + 26px));min-height:100svh}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--muted);margin:0 0 7px}h1{font-size:25px;font-weight:600;letter-spacing:.09em;margin:0}.sound{border:1px solid #d2c8b8;border-radius:50%;width:43px;height:43px;background:#ffffff66;font-size:11px}.intro{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-bottom:22px}.levels{display:flex;padding:5px;border-radius:13px;background:#ded7ca;gap:4px}.level{flex:1;border:0;border-radius:9px;background:transparent;padding:10px 0;font-size:15px;font-weight:600}.level small{display:block;font-size:9px;font-weight:400;margin-top:4px;color:var(--muted)}.level[aria-pressed=true]{background:#fffcf5;box-shadow:0 2px 5px #53432a18}.stats{display:flex;justify-content:space-around;text-align:center;margin:22px 0 18px}.label{display:block;font-size:10px;letter-spacing:.12em;color:var(--muted);margin-bottom:5px}.value{font-size:27px;font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:.04em}.board-frame{position:relative;padding:13px;border-radius:17px;background:repeating-linear-gradient(3deg,#785335 0px,#795437 3px,#825b3c 4px,#7a5437 8px);box-shadow:0 13px 25px #51381926,inset 0 1px 2px #d7b88e,inset 0 -4px 3px #4f321b}.board{position:relative;aspect-ratio:1;border-radius:7px;background:#483425;box-shadow:inset 0 3px 9px #21180eaa;touch-action:none;overflow:hidden}.tile{position:absolute;left:0;top:0;width:calc((100% - (var(--n) + 1)*var(--gap))/var(--n));height:calc((100% - (var(--n) + 1)*var(--gap))/var(--n));border:1px solid #d4a665;border-bottom:3px solid #a9753d;border-radius:7px;background:repeating-linear-gradient(96deg,transparent 0 10px,#8e5b2020 11px,transparent 12px 22px),linear-gradient(120deg,#f0d3a0,#dbb47b 65%,#cfa168);box-shadow:inset 0 1px 1px #fff5d7,0 3px 3px #20120866;color:#63421f;text-shadow:0 1px #fff2d1;font-family:Georgia,serif;font-size:clamp(22px,8vw,37px);font-weight:500;transition:transform .13s ease;display:grid;place-items:center;touch-action:none}.tile.correct{color:#426149}.hint{text-align:center;font-size:11px;color:var(--muted);margin:18px 0 20px}.actions{display:flex;gap:10px}.action{border:1px solid #cbbfac;background:#f7f2e7;border-radius:11px;padding:13px 10px;flex:1;font-size:13px;font-weight:600}.primary{background:var(--green);border-color:var(--green);color:#fff9ed}.best{margin-top:22px;padding:16px 18px;background:#ffffff55;border:1px solid #fff9;border-radius:12px;display:flex;justify-content:space-between;align-items:center}.best-title{font-size:12px;font-weight:600}.best-note{font-size:10px;color:var(--muted);margin-top:5px}.best-value{font-size:13px;text-align:right;line-height:1.7;font-variant-numeric:tabular-nums}footer{text-align:center;font-size:9px;letter-spacing:.15em;color:#a09485;margin-top:23px}.overlay{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background:#30281b55;border-radius:17px;backdrop-filter:blur(5px)}.overlay[hidden]{display:none}.win{width:85%;padding:27px 17px;text-align:center;background:#fff9ec;border-radius:15px;box-shadow:0 10px 30px #21180e44}.win .flower{font-size:35px;color:#b08c43}.win h2{font-size:24px;margin:10px 0}.win p{font-size:12px;line-height:1.9}.win button{width:100%;margin-top:10px}.board-frame.won{animation:glow .7s ease 2}@keyframes glow{50%{box-shadow:0 0 32px #c9a65799}}.live{font-size:11px;text-align:center;color:#6b725c;min-height:17px;margin:10px 0 0}.save-note{font-size:10px;color:#856848;text-align:center;margin:6px 0}@media(max-height:740px){.app{padding-top:max(14px,env(safe-area-inset-top))}header{margin-bottom:12px}.intro{margin-bottom:14px}.stats{margin:14px 0}.hint{margin:14px 0}.best{margin-top:15px}footer{margin-top:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header><div><p class="eyebrow">A LITTLE MOMENT OF CALM</p><h1>こもれびの15パズル</h1></div><button class="sound" id="sound" aria-pressed="false" aria-label="効果音をオンにする">音 OFF</button></header>
<p class="intro">ひとつずつ動かして、数字を順番に。</p>
<nav class="levels" aria-label="盤面の大きさ"><button class="level" data-size="3" aria-pressed="false">3 × 3<small>やさしい</small></button><button class="level" data-size="4" aria-pressed="true">4 × 4<small>ふつう</small></button><button class="level" data-size="5" aria-pressed="false">5 × 5<small>むずかしい</small></button></nav>
<section class="stats" aria-label="プレイ状況"><div><span class="label">経過時間</span><span class="value" id="time">00:00</span></div><div><span class="label">移動回数</span><span class="value" id="moves">0</span></div></section>
<div class="board-frame" id="frame"><div class="board" id="board" role="group" aria-label="4 × 4 パズル"></div><section class="overlay" id="overlay" hidden aria-label="クリア結果"><div class="win"><div class="flower" aria-hidden="true">✺</div><h2>おみごと！</h2><p id="result"></p><button class="action primary" id="again">もう一度あそぶ</button><button class="action" id="close-result">完成した盤面を見る</button></div></section></div>
<p class="hint">空いているマスのとなりの駒をタップ</p>
<div class="actions"><button class="action primary" id="shuffle">新しくシャッフル</button><button class="action" id="retry">同じ盤面で再挑戦</button></div>
<p class="live" id="status" role="status" aria-live="polite">最初の一手でスタートします</p>
<section class="best"><div><div class="best-title">あなたのベスト <span id="best-size">4 × 4</span></div><div class="best-note">最短時間 / 最少移動回数</div></div><div class="best-value" id="best">まだ記録がありません</div></section><p class="save-note" id="save-note" hidden>このブラウザーでは記録を保存できません。</p>
<footer>ひと息ついて、もう一手。</footer>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),board=$('board'),key='komorebi-puzzle-v1';
let size=4,cells=[],initial=[],moves=0,started=null,elapsed=0,finished=false,sound=false,audio=null,records={};
try{const stored=JSON.parse(localStorage.getItem(key)||'{}');if(stored&&typeof stored==='object')records=stored;}catch(e){$('save-note').hidden=false;}
const solved=a=>a.every((v,i)=>v===(i+1)%(a.length));
const neighbors=(i,n=size)=>[i-n,i+n,i%n?i-1:-1,i%n<n-1?i+1:-1].filter(j=>j>=0&&j<n*n);
const format=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function nowElapsed(){return started===null?elapsed:elapsed+performance.now()-started;}
function showBest(){const r=records[size];$('best-size').textContent=size+' × '+size;$('best').textContent=r&&Number.isFinite(r.time)&&Number.isFinite(r.moves)?format(r.time)+' / '+r.moves+' 手':'まだ記録がありません';}
function tick(){$('time').textContent=format(nowElapsed());}setInterval(tick,200);
function render(){const gap=7,w=board.clientWidth,step=(w-gap)/size;board.style.setProperty('--n',size);for(const tile of board.children){const v=Number(tile.dataset.value),i=cells.indexOf(v);tile.style.transform=`translate(${gap+i%size*step}px,${gap+Math.floor(i/size)*step}px)`;tile.classList.toggle('correct',i===v-1);tile.setAttribute('aria-label',v+'、'+(Math.floor(i/size)+1)+'行'+(i%size+1)+'列');tile.setAttribute('aria-disabled',String(finished||!neighbors(cells.indexOf(0)).includes(i)));}$('moves').textContent=moves;tick();}
function build(){board.replaceChildren();board.setAttribute('aria-label',size+' × '+size+' パズル');for(let v=1;v<size*size;v++){const b=document.createElement('button');b.className='tile';b.textContent=v;b.dataset.value=v;b.addEventListener('click',()=>move(v));board.append(b);}render();}
function reset(a){cells=a.slice();moves=0;started=null;elapsed=0;finished=false;$('overlay').hidden=true;$('frame').classList.remove('won');$('status').textContent='最初の一手でスタートします';build();showBest();}
function shuffle(){let a=Array.from({length:size*size},(_,i)=>(i+1)%(size*size)),blank=a.length-1,previous=-1;for(let k=0;k<size*size*80;k++){const choices=neighbors(blank).filter(j=>j!==previous),j=choices[Math.floor(Math.random()*choices.length)];[a[blank],a[j]]=[a[j],a[blank]];previous=blank;blank=j;}if(solved(a)){const j=neighbors(blank)[0];[a[blank],a[j]]=[a[j],a[blank]];}initial=a.slice();reset(initial);}
function unlockAudio(){if(!sound)return;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});}catch(e){}}
function clack(){if(!sound||!audio)return;try{const t=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain(),filter=audio.createBiquadFilter();osc.type='triangle';osc.frequency.setValueAtTime(620,t);osc.frequency.exponentialRampToValueAtTime(170,t+.045);filter.type='lowpass';filter.frequency.value=1400;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.12,t+.003);gain.gain.exponentialRampToValueAtTime(.0001,t+.065);osc.connect(filter);filter.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+.07);osc.onended=()=>{osc.disconnect();filter.disconnect();gain.disconnect();};}catch(e){}}
function move(v){if(finished)return;const i=cells.indexOf(v),blank=cells.indexOf(0);if(!neighbors(blank).includes(i))return;unlockAudio();if(started===null)started=performance.now();[cells[i],cells[blank]]=[cells[blank],cells[i]];moves++;clack();if(solved(cells)){elapsed=nowElapsed();started=null;finished=true;const old=records[size];const valid=old&&Number.isFinite(old.time)&&Number.isFinite(old.moves);const better=!valid||elapsed<old.time||moves<old.moves;records[size]={time:valid?Math.min(old.time,elapsed):elapsed,moves:valid?Math.min(old.moves,moves):moves};try{localStorage.setItem(key,JSON.stringify(records));}catch(e){$('save-note').hidden=false;}$('result').textContent=format(elapsed)+' ・ '+moves+' 手でクリア。'+(better?' ベスト記録を更新しました！':' おつかれさまでした。');$('status').textContent='クリア！ 数字がきれいに並びました。';$('frame').classList.add('won');$('overlay').hidden=false;$('again').focus({preventScroll:true});showBest();}else $('status').textContent='数字を左上から順番に並べましょう';render();}
document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{size=Number(b.dataset.size);document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));shuffle();}));
$('shuffle').onclick=shuffle;$('again').onclick=()=>{shuffle();$('shuffle').focus({preventScroll:true});};$('retry').onclick=()=>reset(initial);$('close-result').onclick=()=>{$('overlay').hidden=true;$('retry').focus({preventScroll:true});};$('sound').onclick=()=>{sound=!sound;unlockAudio();$('sound').textContent=sound?'音 ON':'音 OFF';$('sound').setAttribute('aria-pressed',String(sound));$('sound').setAttribute('aria-label',sound?'効果音をオフにする':'効果音をオンにする');if(sound)clack();};
board.addEventListener('contextmenu',e=>e.preventDefault());board.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
board.addEventListener('keydown',e=>{const offsets={ArrowUp:-size,ArrowDown:size,ArrowLeft:-1,ArrowRight:1};if(!(e.key in offsets))return;e.preventDefault();const blank=cells.indexOf(0),i=blank+offsets[e.key];if(neighbors(blank).includes(i))move(cells[i]);});
if(window.ResizeObserver)new ResizeObserver(render).observe(board);else window.addEventListener('resize',render);shuffle();
})();
</script>
</body>
</html>
