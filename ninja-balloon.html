<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#57bce5">
<title>女忍者の気球</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071f39;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#1c6380,#071f39 72%)}
#game{display:block;width:min(100vw,56.25vh);height:min(100vh,177.78vw);max-width:100%;max-height:100%;background:#80d3ed;box-shadow:0 0 50px #0008}
#ui{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center}
.panel{pointer-events:auto;width:min(84vw,390px);padding:28px 24px 24px;color:#fff;text-align:center;border:1px solid #ffffff38;border-radius:24px;background:linear-gradient(145deg,#0c2747e8,#143e61df);box-shadow:0 20px 60px #00162c99,inset 0 1px #ffffff3b;backdrop-filter:blur(12px)}
.eyebrow{font-weight:800;letter-spacing:.18em;color:#ffcb54;font-size:12px}.panel h1{margin:9px 0 8px;font-size:clamp(31px,9vw,45px);line-height:1.06;text-shadow:0 3px 0 #06182d}.panel p{margin:8px 0 21px;color:#d9effa;line-height:1.65;font-weight:650;font-size:14px}.panel button{width:100%;border:0;border-radius:999px;padding:15px 20px;background:linear-gradient(#ffd660,#f5a817);color:#332000;font:900 17px inherit;box-shadow:0 6px 0 #a85e05,0 11px 25px #0007;cursor:pointer}.panel button:active{transform:translateY(4px);box-shadow:0 2px 0 #a85e05}.panel #stage2,.panel #stage3{margin-top:11px;padding:10px;background:#163e5d;color:#dff8ff;border:1px solid #7fd7e477;box-shadow:0 4px 0 #061a2b,0 8px 18px #0004;font-size:13px}.small{font-size:11px!important;color:#a9cddd!important;margin:16px 0 0!important}.hidden{display:none!important}
#mute{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));pointer-events:auto;width:42px;height:42px;border:1px solid #fff5;border-radius:50%;background:#09243ac9;color:#fff;font-size:19px;box-shadow:0 5px 18px #0005}
</style>
</head>
<body><div id="wrap"><canvas id="game" width="450" height="800" aria-label="女忍者の気球ゲーム"></canvas><div id="ui"><section id="panel" class="panel"><div class="eyebrow">STAGE 1 · COASTAL CITY</div><h1 id="title">女忍者の気球</h1><p id="message">タップでふわりと上昇。<br>海辺の街を越えて500m先へ！</p><button id="start">飛び立つ</button><button id="stage2">Stage 2から遊ぶ</button><button id="stage3">Stage 3から遊ぶ</button><p class="small">画面タップ / スペースキー　・　3回衝突で終了</p></section><button id="mute" aria-label="音を切り替える">♫</button></div></div>
<script>
(()=>{'use strict';
const C=document.querySelector('#game'),X=C.getContext('2d'),panel=document.querySelector('#panel'),eyebrow=document.querySelector('.eyebrow'),title=document.querySelector('#title'),msg=document.querySelector('#message'),start=document.querySelector('#start'),stage2Btn=document.querySelector('#stage2'),stage3Btn=document.querySelector('#stage3'),mute=document.querySelector('#mute');
const W=450,H=800,TAU=Math.PI*2;let stage=1,state='title',last=0,elapsed=0,distance=0,lives=3,inv=0,shake=0,burn=0,muted=false,audio=null,master=null,engine=null,engineGain=null;
const balloon={x:208,y:390,vy:0,r:28};let obstacles=[],particles=[],clouds=[],nextSpawn=0,world=0;
for(let i=0;i<10;i++)clouds.push({x:Math.random()*W,y:80+Math.random()*430,s:.45+Math.random(),z:.25+Math.random()*.6});
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r)}function initAudio(){if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=muted?0:.25;master.connect(audio.destination)}
function tone(freq,dur,type='sine',vol=.12,when=0){if(!audio||muted)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+when;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(master);o.start(t);o.stop(t+dur+.03)}
function burnerSound(){tone(95,.12,'sawtooth',.035)}
function crowSound(){if(!audio||muted)return;const kaa=(delay,pitch)=>{const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(690*pitch,t);o.frequency.exponentialRampToValueAtTime(390*pitch,t+.13);o.frequency.exponentialRampToValueAtTime(285*pitch,t+.38);f.type='bandpass';f.frequency.value=720;f.Q.value=.75;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.12,t+.025);g.gain.setValueAtTime(.1,t+.13);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+.42)};kaa(0,1);kaa(.43,.92)}
function startEngine(){if(!audio||engine)return;engine=audio.createOscillator();const lfo=audio.createOscillator(),lg=audio.createGain();engineGain=audio.createGain();engine.type='sawtooth';engine.frequency.value=68;lfo.frequency.value=7;lg.gain.value=5;lfo.connect(lg).connect(engine.frequency);engineGain.gain.value=0;engine.connect(engineGain).connect(master);engine.start();lfo.start()}
function stopEngine(){if(engine){engine.stop();engine=null;engineGain=null}}
function reset(){distance=0;lives=3;elapsed=0;inv=0;shake=0;world=0;nextSpawn=1.3;obstacles=[];particles=[];balloon.y=400;balloon.vy=0;state='play';stage2Btn.classList.add('hidden');stage3Btn.classList.add('hidden');panel.classList.add('hidden');startEngine()}
function flap(){if(state==='title'||state==='over'||state==='win')return;balloon.vy=Math.max(balloon.vy-212,-188);burn=.16;burnerSound();for(let i=0;i<4;i++)particles.push({x:balloon.x+3+Math.random()*8,y:balloon.y+36,vx:(Math.random()-.5)*22,vy:45+Math.random()*35,a:1,r:2+Math.random()*3,c:'#ffb32f'})}
function addObstacle(){let type;const r=Math.random();if(stage===1){if(r<.37)type='crow';else if(r<.56)type='plane';else if(r<.78)type='crane';else type='building'}else if(stage===2){if(r<.34)type='crow';else if(r<.54)type='plane';else type='turbine'}else{if(r<.28)type='crow';else if(r<.43)type='plane';else if(r<.7)type='lighthouse';else type='gantry'}let o={type,x:W+70,hit:false,t:Math.random()*6};if(type==='crow')Object.assign(o,{y:135+Math.random()*480,w:55,h:32,v:105+Math.random()*35,called:false});if(type==='plane')Object.assign(o,{y:80+Math.random()*145,w:102,h:38,v:48+Math.random()*15});if(type==='crane')Object.assign(o,{y:315+Math.random()*165,w:175,h:H,v:72});if(type==='turbine')Object.assign(o,{y:300+Math.random()*175,w:145,h:H,v:68});if(type==='lighthouse')Object.assign(o,{y:330+Math.random()*150,w:58,h:H,v:69});if(type==='gantry')Object.assign(o,{y:330+Math.random()*140,w:130,h:H,v:73});if(type==='building')Object.assign(o,{y:350+Math.random()*170,w:105+Math.random()*45,h:H,v:70});obstacles.push(o)}
function hitboxes(o){if(o.type==='crow')return[{x:o.x-24,y:o.y-13,w:48,h:26}];if(o.type==='plane')return[{x:o.x-48,y:o.y-13,w:96,h:26}];if(o.type==='crane')return[{x:o.x-11,y:o.y+6,w:22,h:H-o.y-6},{x:o.x-42,y:o.y-7,w:177,h:16}];if(o.type==='turbine'){const bs=[{x:o.x-9,y:o.y+8,w:18,h:H-o.y-8},{x:o.x-12,y:o.y-12,w:24,h:24}],a=o.t*.85;for(let i=0;i<3;i++){const d=a+i*TAU/3;for(const q of[.38,.68,.94])bs.push({x:o.x+Math.cos(d)*68*q-7,y:o.y+Math.sin(d)*68*q-7,w:14,h:14})}return bs}if(o.type==='lighthouse')return[{x:o.x-25,y:o.y+9,w:50,h:34},{x:o.x-18,y:o.y+40,w:36,h:H-o.y-40}];if(o.type==='gantry')return[{x:o.x-65,y:o.y,w:130,h:18},{x:o.x-61,y:o.y+14,w:18,h:H-o.y-14},{x:o.x+43,y:o.y+14,w:18,h:H-o.y-14}];return[{x:o.x-o.w/2+6,y:o.y,w:o.w-12,h:H-o.y}]}
function collide(a,b){return a.x+a.r>b.x&&a.x-a.r<b.x+b.w&&a.y+a.r>b.y&&a.y-a.r<b.y+b.h}
function damage(){if(inv>0)return;lives--;inv=2;shake=.4;tone(120,.38,'square',.12);balloon.vy=-150;for(let i=0;i<18;i++)particles.push({x:balloon.x,y:balloon.y,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*220,a:1,r:2+Math.random()*5,c:i%2?'#ffcf4c':'#fff'});if(lives<=0)finish(false)}
function finish(win){stopEngine();panel.classList.remove('hidden');if(!win){state='over';eyebrow.textContent=`STAGE ${stage}`;title.textContent='飛行失敗…';msg.innerHTML=`到達距離 <b>${Math.floor(distance)}m</b><br>もう一度、風を読もう。`;start.textContent='もう一度 飛ぶ';return}if(stage<3){state='stageclear';eyebrow.textContent=`STAGE ${stage} COMPLETE`;title.textContent=stage===1?'海辺の街を突破！':'風車地帯を突破！';msg.innerHTML=stage===1?'<b>500m 到達！</b><br>次は海上の風車地帯へ。':'<b>500m 到達！</b><br>最後は夕暮れの港へ。';start.textContent=`Stage ${stage+1}へ`}else{state='win';eyebrow.textContent='ALL STAGES COMPLETE';title.textContent='任務完了！';msg.innerHTML='<b>港を突破！</b><br>女忍者は三つの空を越えた。';start.textContent='Stage 1から遊ぶ'}}
function update(dt){if(state!=='play')return;elapsed+=dt;distance=Math.min(500,distance+dt*8.8);world+=dt*70;inv=Math.max(0,inv-dt);shake=Math.max(0,shake-dt);burn=Math.max(0,burn-dt);balloon.vy+=92*dt;balloon.vy=Math.min(balloon.vy,145);balloon.y+=balloon.vy*dt;if(balloon.y<95){balloon.y=95;balloon.vy=35}if(balloon.y>720){balloon.y=720;damage()}
nextSpawn-=dt;if(nextSpawn<=0){addObstacle();nextSpawn=1.65+Math.random()*1.55}
let planeNear=0;for(const o of obstacles){o.t+=dt;o.x-=o.v*dt;if(o.type==='crow'&&!o.called&&o.x<W*.78){o.called=true;crowSound()}if(o.type==='plane')planeNear=Math.max(planeNear,1-Math.min(1,Math.abs(o.x-balloon.x)/360));if(!o.hit&&hitboxes(o).some(b=>collide(balloon,b))){o.hit=true;damage()}}
if(engineGain)engineGain.gain.setTargetAtTime(.008+planeNear*.055,audio.currentTime,.08);obstacles=obstacles.filter(o=>o.x>-170);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=25*dt;p.a-=dt*1.5}particles=particles.filter(p=>p.a>0);if(distance>=500)finish(true)}
function sky(){let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#62c7eb');g.addColorStop(.58,'#a8e1ef');g.addColorStop(1,'#e8cba3');X.fillStyle=g;X.fillRect(0,0,W,H);const sx=stage===3?335:stage===2?370:366,sy=stage===3?500:stage===2?104:118,sr=stage===3?48:stage===2?40:36,sc=stage===3?'#ff9147':stage===2?'#fff9d0':'#ffe7a0';let sun=X.createRadialGradient(sx,sy,sr*.15,sx,sy,sr*2.25);sun.addColorStop(0,sc);sun.addColorStop(.42,sc);sun.addColorStop(1,'#fff0');X.fillStyle=sun;X.beginPath();X.arc(sx,sy,sr*2.25,0,TAU);X.fill();X.fillStyle=sc;X.beginPath();X.arc(sx,sy,sr,0,TAU);X.fill();X.fillStyle='#ffffff45';for(const c of clouds){let x=(c.x-world*c.z)%(W+180);if(x<-110)x+=W+180;X.save();X.translate(x,c.y);X.scale(c.s,c.s*.7);for(let k=0;k<4;k++){X.beginPath();X.arc(k*28,Math.sin(k)*5,26-k*2,0,TAU);X.fill()}X.restore()}
if(stage===1){X.fillStyle='#6c87909e';for(let i=0;i<12;i++){let x=((i*67-world*.32)%(W+100))-50,h=35+(i*37)%70;X.fillRect(x,H-90-h,45,H);X.fillStyle='#9fb4b8aa';X.fillRect(x+7,H-80-h,4,h-10);X.fillStyle='#6c87909e'}X.fillStyle='#344f55';X.fillRect(0,H-54,W,54);X.fillStyle='#527078';for(let i=0;i<14;i++)X.fillRect(((i*43-world*.55)%(W+40))-20,H-48,22,4)}else{let sea=X.createLinearGradient(0,H-210,0,H);sea.addColorStop(0,stage===2?'#6cc9dc':'#477f9d');sea.addColorStop(1,stage===2?'#12658c':'#173b5d');X.fillStyle=sea;X.fillRect(0,H-210,W,210);X.strokeStyle='#d8fbff88';X.lineWidth=2;for(let i=0;i<6;i++){const yy=H-190+i*34;X.beginPath();for(let xx=-40;xx<W+40;xx+=24){let wx=xx-(world*(.18+i*.035))%24;X.moveTo(wx,yy);X.quadraticCurveTo(wx+6,yy-4,wx+12,yy);X.quadraticCurveTo(wx+18,yy+4,wx+24,yy)}X.stroke()}if(stage===2){X.fillStyle='#e9f5f2';for(const dx of[50,185,335]){const px=((dx-world*.12)%(W+120)+W+120)%(W+120)-50;X.fillRect(px-2,H-260,4,50);X.save();X.translate(px,H-260);X.rotate(world*.006);for(let k=0;k<3;k++){X.rotate(TAU/3);X.beginPath();X.moveTo(2,0);X.lineTo(34,-5);X.lineTo(36,1);X.lineTo(3,4);X.fill()}X.restore()}}else{X.fillStyle='#e77d5633';X.fillRect(0,0,W,H-210);X.fillStyle='#36485b';for(let i=0;i<7;i++){const px=((i*86-world*.2)%(W+100))-40;X.fillRect(px,H-245,58,35+(i%2)*18);X.fillStyle=i%2?'#b84d45':'#d0843d';X.fillRect(px+4,H-238,50,12);X.fillStyle='#36485b'}X.strokeStyle='#263747';X.lineWidth=5;for(const dx of[90,300]){const px=((dx-world*.1)%(W+160)+W+160)%(W+160)-40;X.beginPath();X.moveTo(px,H-250);X.lineTo(px,H-325);X.lineTo(px+75,H-325);X.lineTo(px+45,H-285);X.stroke()}}}}
function drawCrow(o){X.save();X.translate(o.x,o.y);const f=Math.sin(o.t*11)*10;X.fillStyle='#111923';X.beginPath();X.ellipse(0,1,18,10,0,0,TAU);X.fill();X.beginPath();X.moveTo(-5,0);X.quadraticCurveTo(-26,-16-f,-35,-5);X.quadraticCurveTo(-21,-2,-5,5);X.moveTo(6,0);X.quadraticCurveTo(25,-16-f,35,-4);X.quadraticCurveTo(22,-1,6,5);X.fill();X.fillStyle='#f1b323';X.beginPath();X.moveTo(17,-2);X.lineTo(29,2);X.lineTo(17,5);X.fill();X.fillStyle='#fff';X.beginPath();X.arc(12,-4,2.5,0,TAU);X.fill();X.restore()}
function drawPlane(o){X.save();X.translate(o.x,o.y);X.fillStyle='#f7f5ed';X.beginPath();X.moveTo(-51,3);X.quadraticCurveTo(-34,-12,22,-8);X.lineTo(50,0);X.lineTo(21,9);X.lineTo(-37,10);X.closePath();X.fill();X.fillStyle='#173b55';X.beginPath();X.moveTo(-10,-8);X.lineTo(10,-8);X.lineTo(22,0);X.lineTo(-3,0);X.fill();X.fillStyle='#d83c31';X.fillRect(-28,4,58,5);X.fillStyle='#eff5f5';X.beginPath();X.moveTo(-20,-4);X.lineTo(11,-25);X.lineTo(27,-24);X.lineTo(8,-3);X.fill();X.beginPath();X.moveTo(-8,1);X.lineTo(25,22);X.lineTo(8,22);X.lineTo(-26,6);X.fill();X.strokeStyle='#333';X.lineWidth=3;X.beginPath();X.arc(-35,12,4,0,TAU);X.arc(15,14,4,0,TAU);X.stroke();X.strokeStyle='#b9d4df';X.lineWidth=3;X.beginPath();X.moveTo(-53,-13);X.lineTo(-53,15);X.stroke();X.restore()}
function drawCrane(o){X.save();X.translate(o.x,o.y);const yellow='#e5aa22',dark='#805b14',light='#ffd45d';X.lineCap='round';X.strokeStyle=dark;X.lineWidth=13;X.beginPath();X.moveTo(0,5);X.lineTo(0,H-o.y);X.stroke();X.strokeStyle=yellow;X.lineWidth=8;X.beginPath();X.moveTo(0,5);X.lineTo(0,H-o.y);X.stroke();X.strokeStyle=light;X.lineWidth=2;for(let yy=18;yy<H-o.y;yy+=27){X.beginPath();X.moveTo(-8,yy-13);X.lineTo(8,yy);X.moveTo(8,yy);X.lineTo(-8,yy+13);X.stroke()}X.strokeStyle=dark;X.lineWidth=12;X.beginPath();X.moveTo(-40,0);X.lineTo(135,0);X.stroke();X.strokeStyle=yellow;X.lineWidth=7;X.beginPath();X.moveTo(-40,0);X.lineTo(135,0);X.stroke();X.strokeStyle=light;X.lineWidth=2;for(let xx=-34;xx<128;xx+=23){X.beginPath();X.moveTo(xx,-6);X.lineTo(xx+18,6);X.moveTo(xx,6);X.lineTo(xx+18,-6);X.stroke()}X.fillStyle='#32485a';rr(7,9,31,24,4);X.fill();X.fillStyle='#a9e3ee';X.fillRect(12,13,17,9);X.fillStyle='#60646a';X.fillRect(-48,-10,16,20);const hx=102+Math.sin(o.t*1.8)*3;X.strokeStyle='#4b5154';X.lineWidth=2;X.beginPath();X.moveTo(hx,5);X.lineTo(hx,62);X.stroke();X.strokeStyle='#3b4144';X.lineWidth=4;X.beginPath();X.arc(hx+5,65,7,.4,Math.PI*1.7);X.stroke();X.fillStyle='#f8ce45';X.beginPath();X.arc(0,0,8,0,TAU);X.fill();X.restore()}
function drawTurbine(o){X.save();X.translate(o.x,o.y);let tg=X.createLinearGradient(-10,0,10,0);tg.addColorStop(0,'#829ba5');tg.addColorStop(.45,'#f4fbfa');tg.addColorStop(1,'#adc2c7');X.fillStyle=tg;X.beginPath();X.moveTo(-8,7);X.lineTo(8,7);X.lineTo(14,H-o.y);X.lineTo(-14,H-o.y);X.closePath();X.fill();X.save();X.rotate(o.t*.85);for(let i=0;i<3;i++){X.rotate(TAU/3);let bg=X.createLinearGradient(8,0,70,0);bg.addColorStop(0,'#d4e2e3');bg.addColorStop(.75,'#f8ffff');bg.addColorStop(1,'#df4144');X.fillStyle=bg;X.beginPath();X.moveTo(7,-5);X.quadraticCurveTo(40,-11,70,-5);X.lineTo(68,4);X.quadraticCurveTo(35,8,7,5);X.closePath();X.fill();X.strokeStyle='#91a9ae';X.lineWidth=1;X.stroke()}X.restore();X.fillStyle='#eef8f7';X.strokeStyle='#708b94';X.lineWidth=2;X.beginPath();X.arc(0,0,13,0,TAU);X.fill();X.stroke();X.fillStyle='#e54a4c';X.beginPath();X.arc(0,0,5,0,TAU);X.fill();X.restore()}
function drawLighthouse(o){X.save();X.translate(o.x,o.y);const beam=o.t*1.15;X.save();X.globalAlpha=.22;let lg=X.createLinearGradient(0,0,125,0);lg.addColorStop(0,'#fff8ad');lg.addColorStop(1,'#fff8ad00');X.fillStyle=lg;X.rotate(beam);X.beginPath();X.moveTo(0,21);X.lineTo(130,-5);X.lineTo(130,47);X.closePath();X.fill();X.restore();X.fillStyle='#303f4a';X.fillRect(-22,17,44,24);X.fillStyle='#ffe277';X.fillRect(-14,21,28,14);X.strokeStyle='#1f303a';X.lineWidth=3;X.strokeRect(-14,21,28,14);X.fillStyle='#b91f35';X.beginPath();X.moveTo(-28,17);X.lineTo(0,3);X.lineTo(28,17);X.closePath();X.fill();X.fillStyle='#f5eee0';X.beginPath();X.moveTo(-17,41);X.lineTo(17,41);X.lineTo(26,H-o.y);X.lineTo(-26,H-o.y);X.closePath();X.fill();X.save();X.beginPath();X.moveTo(-17,41);X.lineTo(17,41);X.lineTo(26,H-o.y);X.lineTo(-26,H-o.y);X.closePath();X.clip();X.fillStyle='#cc3040';for(let yy=70;yy<H-o.y;yy+=76){X.save();X.translate(0,yy);X.rotate(-.15);X.fillRect(-38,-13,76,26);X.restore()}X.restore();X.fillStyle='#7b8990';X.fillRect(-32,H-o.y-12,64,12);X.restore()}
function drawGantry(o){X.save();X.translate(o.x,o.y);const orange='#e17c2d',dark='#6c351c',hi='#ffb252';X.strokeStyle=dark;X.lineWidth=18;X.beginPath();X.moveTo(-52,10);X.lineTo(-52,H-o.y);X.moveTo(52,10);X.lineTo(52,H-o.y);X.stroke();X.strokeStyle=orange;X.lineWidth=12;X.beginPath();X.moveTo(-52,10);X.lineTo(-52,H-o.y);X.moveTo(52,10);X.lineTo(52,H-o.y);X.stroke();X.strokeStyle=dark;X.lineWidth=20;X.beginPath();X.moveTo(-67,0);X.lineTo(67,0);X.stroke();X.strokeStyle=orange;X.lineWidth=13;X.beginPath();X.moveTo(-67,0);X.lineTo(67,0);X.stroke();X.strokeStyle=hi;X.lineWidth=2;for(let xx=-58;xx<58;xx+=22){X.beginPath();X.moveTo(xx,-6);X.lineTo(xx+17,6);X.moveTo(xx,6);X.lineTo(xx+17,-6);X.stroke()}for(const sx of[-52,52])for(let yy=28;yy<H-o.y;yy+=32){X.beginPath();X.moveTo(sx-7,yy-14);X.lineTo(sx+7,yy);X.moveTo(sx+7,yy);X.lineTo(sx-7,yy+14);X.stroke()}X.strokeStyle='#2b3740';X.lineWidth=2;X.beginPath();X.moveTo(0,8);X.lineTo(0,55);X.stroke();X.fillStyle='#b8433d';X.fillRect(-24,55,48,25);X.fillStyle='#efb349';X.fillRect(-20,60,40,4);X.fillStyle='#263946';X.beginPath();X.arc(-52,H-o.y-3,9,0,TAU);X.arc(52,H-o.y-3,9,0,TAU);X.fill();X.restore()}
function drawBuilding(o){const x=o.x-o.w/2,y=o.y;let g=X.createLinearGradient(x,y,x+o.w,y);g.addColorStop(0,'#102c42');g.addColorStop(.45,'#3d7892');g.addColorStop(.62,'#b9e3ea');g.addColorStop(1,'#17384e');X.fillStyle=g;X.beginPath();X.moveTo(x+8,y);X.lineTo(x+o.w-10,y+12);X.lineTo(x+o.w,H);X.lineTo(x,H);X.closePath();X.fill();X.strokeStyle='#a9dce055';X.lineWidth=1;for(let xx=x+14;xx<x+o.w;xx+=17){X.beginPath();X.moveTo(xx,y+7);X.lineTo(xx,H);X.stroke()}for(let yy=y+24;yy<H;yy+=24){X.beginPath();X.moveTo(x,yy);X.lineTo(x+o.w,yy);X.stroke()}X.fillStyle='#d7fbff59';X.beginPath();X.moveTo(x+o.w*.52,y+8);X.lineTo(x+o.w*.7,y+10);X.lineTo(x+o.w*.48,H);X.lineTo(x+o.w*.25,H);X.closePath();X.fill()}
function drawBalloon(){let blink=inv>0&&Math.floor(inv*10)%2===0;X.save();X.globalAlpha=blink?.32:1;X.translate(balloon.x,balloon.y);X.rotate(Math.sin(elapsed*2.2)*.025+balloon.vy*.00015);
// scarf behind
X.strokeStyle='#c82738';X.lineWidth=7;X.lineCap='round';X.beginPath();X.moveTo(4,26);X.bezierCurveTo(-20+Math.sin(elapsed*7)*6,20,-40,30+Math.sin(elapsed*8)*7,-59,17);X.stroke();X.fillStyle='#e23b48';X.beginPath();X.moveTo(-58,13);X.lineTo(-72,18);X.lineTo(-60,24);X.fill();
// envelope
let g=X.createRadialGradient(-12,-32,4,0,-27,49);g.addColorStop(0,'#e8fbf5');g.addColorStop(.28,'#62d4cc');g.addColorStop(.7,'#1b9fba');g.addColorStop(1,'#11617d');X.fillStyle=g;X.beginPath();X.moveTo(0,-83);X.bezierCurveTo(-52,-83,-57,-23,-26,7);X.quadraticCurveTo(-16,17,-11,23);X.lineTo(11,23);X.quadraticCurveTo(16,17,26,7);X.bezierCurveTo(57,-23,52,-83,0,-83);X.fill();X.strokeStyle='#ffffff77';X.lineWidth=2;X.beginPath();X.moveTo(0,-80);X.bezierCurveTo(-10,-47,-10,-6,0,20);X.moveTo(-28,-71);X.bezierCurveTo(-36,-35,-26,-2,-10,21);X.moveTo(28,-71);X.bezierCurveTo(36,-35,26,-2,10,21);X.stroke();
// ropes & burner
X.strokeStyle='#604c35';X.lineWidth=2;X.beginPath();X.moveTo(-17,11);X.lineTo(-13,49);X.moveTo(17,11);X.lineTo(13,49);X.stroke();if(burn>0){X.fillStyle='#ffef64';X.beginPath();X.moveTo(-6,34);X.quadraticCurveTo(0,17,6,34);X.quadraticCurveTo(0,45,-6,34);X.fill();X.fillStyle='#ff7b1f';X.beginPath();X.moveTo(-3,35);X.quadraticCurveTo(0,25,3,35);X.quadraticCurveTo(0,41,-3,35);X.fill()}
// ninja — crimson hood keeps her face bright and readable at phone size
X.fillStyle='#b91732';X.beginPath();X.arc(0,31,13,0,TAU);X.fill();X.fillStyle='#f2b28e';X.beginPath();X.ellipse(0,31,9,7,0,0,TAU);X.fill();X.fillStyle='#d42b43';X.beginPath();X.moveTo(-11,25);X.quadraticCurveTo(0,15,11,25);X.lineTo(8,28);X.quadraticCurveTo(0,24,-8,28);X.closePath();X.fill();X.beginPath();X.moveTo(-10,35);X.quadraticCurveTo(0,40,10,35);X.lineTo(8,41);X.lineTo(-8,41);X.closePath();X.fill();X.fillStyle='#1d2530';X.beginPath();X.ellipse(-4,31,1.8,1.2,0,0,TAU);X.ellipse(4,31,1.8,1.2,0,0,TAU);X.fill();X.fillStyle='#172434';X.fillRect(-12,39,24,16);X.fillStyle='#d42b43';X.fillRect(-12,39,24,5);X.fillStyle='#ef5363';X.fillRect(-10,44,3,10);X.fillRect(7,44,3,10);
// basket
let b=X.createLinearGradient(-18,45,18,67);b.addColorStop(0,'#d89a44');b.addColorStop(1,'#86511e');X.fillStyle=b;X.beginPath();X.moveTo(-19,45);X.lineTo(19,45);X.lineTo(14,68);X.lineTo(-14,68);X.closePath();X.fill();X.strokeStyle='#f1c16d';X.lineWidth=2;for(let yy=51;yy<67;yy+=7){X.beginPath();X.moveTo(-16,yy);X.lineTo(16,yy);X.stroke()}X.restore()}
function hud(){X.save();X.fillStyle='#08233ccb';rr(16,18,193,53,17);X.fill();X.fillStyle='#9fdff0';X.font='800 10px system-ui';X.fillText(`STAGE ${stage}`,31,36);X.fillStyle='#fff';X.font='900 18px system-ui';X.fillText(`${Math.floor(distance)} / 500m`,31,57);X.fillStyle='#ffce4e';X.font='900 19px system-ui';X.fillText('♥'.repeat(lives),336-lives*3,51);X.fillStyle='#ffffff75';X.fillText('♡'.repeat(3-lives),336+lives*18,51);X.fillStyle='#ffffff50';rr(25,78,400,8,4);X.fill();let g=X.createLinearGradient(25,0,425,0);g.addColorStop(0,'#ffb52d');g.addColorStop(1,'#fff27c');X.fillStyle=g;rr(25,78,400*distance/500,8,4);X.fill();X.restore()}
function draw(){X.save();if(shake>0)X.translate((Math.random()-.5)*12,(Math.random()-.5)*12);sky();for(const o of obstacles){if(o.type==='crow')drawCrow(o);else if(o.type==='plane')drawPlane(o);else if(o.type==='crane')drawCrane(o);else if(o.type==='turbine')drawTurbine(o);else if(o.type==='lighthouse')drawLighthouse(o);else if(o.type==='gantry')drawGantry(o);else drawBuilding(o)}drawBalloon();for(const p of particles){X.globalAlpha=p.a;X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.r,0,TAU);X.fill()}X.globalAlpha=1;if(state==='play')hud();X.restore()}
function loop(t){let dt=Math.min(.034,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
start.addEventListener('click',e=>{e.stopPropagation();initAudio();audio.resume();if(state==='stageclear')stage++;else if(state==='win')stage=1;const names=['','COASTAL CITY','WIND FARM','SUNSET HARBOR'];eyebrow.textContent=`STAGE ${stage} · ${names[stage]}`;reset()});C.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();if(audio.state==='suspended')audio.resume();flap()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state==='play')flap();else start.click()}});mute.addEventListener('click',e=>{e.stopPropagation();muted=!muted;mute.textContent=muted?'♪̸':'♫';if(master)master.gain.value=muted?0:.25});requestAnimationFrame(loop);
stage2Btn.addEventListener('click',e=>{e.stopPropagation();initAudio();audio.resume();stage=2;eyebrow.textContent='STAGE 2 · WIND FARM';reset()});
stage3Btn.addEventListener('click',e=>{e.stopPropagation();initAudio();audio.resume();stage=3;eyebrow.textContent='STAGE 3 · SUNSET HARBOR';reset()});
})();
